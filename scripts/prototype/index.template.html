<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AvaGithubDesktop</title><link rel="icon" href="../../logo.png"><link rel="stylesheet" href="assets/appearance.css"><link rel="stylesheet" href="assets/product.css"></head>
<body><main class="win">
<header class="top" data-region="titlebar"><img class="app-icon" src="../../logo.png" alt=""><b>AvaGithubDesktop</b><nav id="main-menu"></nav><span class="spacer"></span><div class="swatches" id="swatches"></div><select id="palette" aria-label="Palette"></select><select id="theme-mode" aria-label="Theme"></select><div class="captions"><button data-action="minimize">−</button><button data-action="maximize">□</button><button data-action="quit">×</button></div></header>
<div class="toolbar" data-region="toolbar"><button id="repository" class="selector"><span>▣</span><span><small data-key="CurrentRepository"></small><b id="repository-name"></b></span><i>▾</i></button><button id="branch" class="selector"><span>⑂</span><span><small data-key="CurrentBranch"></small><b id="branch-name">main</b></span><i>▾</i></button><button id="remote" class="selector"><span>⟳</span><span><b id="sync-name"></b><small id="sync-detail"></small></span><i>▾</i></button></div>
<div class="workspace" data-region="workspace"><section class="left" data-region="left"><div class="tabs"><button id="changes-tab" data-view="changes" class="selected"><span data-key="Changes"></span><small id="changes-count"></small></button><button data-view="history" data-key="History"></button></div><div class="file-area"><input id="filter" data-placeholder="ChangesFilterPlaceholder"><div id="selection-header"><input id="select-all" type="checkbox" checked><b id="selection-title"></b><small id="selected-count"></small></div><div id="files"></div><div id="history" hidden></div></div><form id="commit-form" data-region="commit"><hr><div class="summary-line"><span>⊙</span><input id="summary" data-placeholder="CommitSummaryPlaceholder"></div><textarea id="description" data-placeholder="CommitDescriptionPlaceholder"></textarea><label class="amend"><input id="amend" type="checkbox"><span data-key="AmendLastCommit"></span></label><button id="stash" type="button" class="outlined" data-key="MenuStashAllChanges"></button><button id="commit" type="submit" class="primary"></button></form></section><div class="vertical-splitter" data-region="splitter"></div><section class="diff-zone" data-region="diff-zone"><article class="diff" data-region="diff"><div class="diff-header"><b id="diff-title">Diff</b><span id="diff-file">README.md</span></div><div id="diff-body"></div></article></section></div>
<div class="horizontal-splitter" data-region="log-splitter"></div><section class="operation-log" data-region="log"><h3 data-key="OperationLog"></h3><div id="log-lines"></div></section><footer data-region="status"><span id="status"></span><span class="spacer"></span><span id="version">0.118.0.16</span></footer>
<div class="popup" id="popup" hidden></div><div class="toast" id="toast" role="status"></div></main>
<dialog id="about-dialog"><div class="dialog-chrome"><b data-key="MenuAbout"></b><div class="about-captions"><button id="about-minimize">−</button><button id="about-maximize">□</button><button id="about-close-caption">×</button></div></div><div class="about-body"><div class="about-head"><img src="../../logo.png" alt=""><div><h2>AvaGithubDesktop</h2><p data-key="AboutDescription"></p></div></div><div class="update-row"><div><b data-key="AboutCheckUpdateLabel"></b><p data-key="AboutUpdateHint"></p></div><button id="update-action" class="primary"></button><p id="update-status" role="status"></p><progress id="update-progress" max="100" hidden></progress><button id="update-cancel" hidden data-key="Cancel"></button><details id="release-notes" hidden><summary data-key="AboutReleaseNotes"></summary><p>0.119.0 · Studio themes · Git workspace</p></details></div><dl id="about-info"></dl><div class="about-actions"><button id="update-recheck" hidden data-key="AboutCheckUpdate"></button><button id="about-close" data-key="Close"></button></div></div></dialog>
<dialog id="action-dialog"><form id="action-form"><h2 id="action-title"></h2><div id="action-content"></div><input id="action-value" autocomplete="off"><div class="dialog-actions"><button type="button" id="action-cancel" data-key="Cancel"></button><button type="submit" class="primary" id="action-confirm" data-key="Confirm"></button></div></form></dialog>
<div id="relaunch" hidden><button data-key="PrototypeRelaunch"></button></div>
<script src="assets/product-data.js"></script><script src="assets/product.js"></script></body></html>
